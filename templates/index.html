<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RM Report</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>RM Report</h1>
    <p class="sub">Field Reporting — Daily Performance Tracking</p>

    <label>Branch</label>
    <select id="branch">
      <option value="">Select branch</option>
      {% for b in branches %}
      <option value="{{ b }}">{{ b }}</option>
      {% endfor %}
    </select>

    <label>RM Name</label>
    <select id="rm" disabled>
      <option value="">Select branch first</option>
    </select>

    <div id="statusBox" class="status hidden">
      <div class="status-top">
        <div class="pie" id="pie"></div>
        <div class="status-text">
          <div><span class="dot dot-on"></span><b id="subCount">0/0</b> Submitted</div>
          <div><span class="dot dot-off"></span><span id="pendCount">0</span> Not Submitted</div>
        </div>
      </div>
      <ul id="pendList"></ul>
    </div>

    <h2>Report Details</h2>

    <div class="grid">
      <div><label>Today Dial</label><input type="number" id="dial" min="0" value="0"></div>
      <div><label>Today Plan</label><input type="number" id="plan" min="0" value="0"></div>
      <div><label>Live Int</label><span class="field-note field-note-current">Current</span><input type="number" id="live_int" min="0" value="0"></div>
      <div><label>Reg Visit</label><span class="field-note">(24/09/2026 TO TODAY)</span><input type="number" id="reg_visit" min="0" value="0"></div>
    </div>
    <label>Reg From RM</label>
    <span class="field-note">(24/09/2026 TO TODAY)</span>
    <input type="number" id="reg_from_rm" min="0" value="0">

    <button type="button" id="saveReportBtn">Save Report</button>
    <div id="msg" class="msg"></div>
  </div>
</div>
<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
